services:
  web:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: /app/data/accesscheck.db
      PRIVATE_EVIDENCE_ROOT: /app/private-inputs
      PUBLIC_EXPORT_ROOT: /app/data/exports
      APP_BASE_URL: http://localhost:3000
    ports: ["3000:3000"]
    volumes:
      - accesscheck-data:/app/data
      - accesscheck-private:/app/private-inputs
      - accesscheck-exports:/app/data/exports
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build: .
    command: ["pnpm", "worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: /app/data/accesscheck.db
      HTTP_PROXY: http://egress-proxy:8080
      HTTPS_PROXY: http://egress-proxy:8080
      NO_PROXY: localhost,127.0.0.1,egress-proxy
      EGRESS_PROXY_URL: http://egress-proxy:8080
    volumes:
      - accesscheck-data:/app/data
    networks: [scan-isolated]
    depends_on: [egress-proxy]
  egress-proxy:
    build:
      context: ./tools/egress-proxy
    read_only: true
    networks: [scan-isolated, external-egress]
    expose: [8080]
volumes:
  accesscheck-data:
  accesscheck-private:
  accesscheck-exports:
networks:
  app:
  scan-isolated:
    internal: true
  external-egress:
