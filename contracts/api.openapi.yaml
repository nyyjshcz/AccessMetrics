openapi: 3.1.0
info:
  title: AccessCheck Lishui API
  version: 1.0.0
paths:
  /api/health:
    get:
      responses:
        "200": { description: healthy }
  /api/scans:
    post:
      responses:
        "202": { description: queued }
        "422": { description: invalid URL or options }
  /api/scans/{jobId}:
    get:
      responses:
        "200": { description: scan job }
  /api/runs/{runId}:
    get:
      responses:
        "200": { description: run and score }
  /api/runs/{runId}/issues:
    get:
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: pageId, in: query, schema: { type: string } }
        - {
            name: principle,
            in: query,
            schema: { type: string, enum: [perceivable, operable, understandable, robust] },
          }
        - {
            name: impact,
            in: query,
            schema: { type: string, enum: [critical, serious, moderate, minor] },
          }
        - { name: ruleId, in: query, schema: { type: string } }
        - {
            name: resultType,
            in: query,
            schema: { type: string, enum: [violation, incomplete, pass], default: violation },
          }
        - {
            name: reviewVerdict,
            in: query,
            schema: { type: string, enum: [confirmed, not_an_issue, uncertain, unreviewed] },
          }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [impact_desc, page_asc, rule_asc], default: impact_desc },
          }
      responses:
        "200": { description: paginated issues }
  /api/admin/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminToken]
              additionalProperties: false
              properties:
                adminToken: { type: string, maxLength: 1024 }
      responses:
        "200": { description: token session }
  /api/admin/session:
    get:
      responses:
        "200": { description: current admin session or unauthenticated }
  /api/reviewer/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewToken]
              additionalProperties: false
              properties:
                reviewToken: { type: string, maxLength: 1024 }
      responses:
        "200": { description: role-bound reviewer session }
  /api/reviewer/session:
    get:
      responses:
        "200": { description: current reviewer session or unauthenticated }
  /api/admin/scans/{jobId}/cancel:
    post:
      responses:
        "202": { description: cancelled }
  /api/admin/review-freezes:
    post:
      responses:
        "201": { description: verified review freeze }
  /api/admin/review-batches:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studyFreezeId, sourceExportId, sourceManifestHash]
              additionalProperties: false
              properties:
                studyFreezeId: { type: string }
                sourceExportId: { type: string }
                sourceManifestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "201": { description: deterministic server-side review sample }
  /api/admin/study-freezes/{freezeId}/finalize:
    post:
      responses:
        "200": { description: study freeze finalized after R4 }
  /api/runs/{runId}/export:
    post:
      responses:
        "201": { description: export created or reused }
  /api/exports/{runId}/json:
    get:
      responses:
        "200": { description: JSON export }
  /api/gates/evidence:
    post:
      responses:
        "201": { description: evidence outbox entry }
  /api/reviewer/review-batches/{batchId}/next:
    get:
      responses:
        "200": { description: next role-bound sample }
  /api/reviewer/nodes/{nodeId}/reviews:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict, note]
              additionalProperties: false
              properties:
                verdict: { type: string, enum: [confirmed, not_an_issue, uncertain] }
                note: { type: string, maxLength: 2000 }
                supersedesReviewId: { type: string }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "201": { description: role-bound review revision }
  /api/reviewer/review-batches/{batchId}/samples/{sampleId}/reviews:
    post:
      responses:
        "201": { description: role-bound formal review revision }
  /api/reviewer/review-batches/{batchId}/samples/{sampleId}/adjudications:
    post:
      responses:
        "201": { description: role-bound adjudication draft }
  /api/reviewer/adjudications/{id}/approve:
    post:
      responses:
        "200": { description: cross-role approval of the exact resolution hash }
  /api/reviewer/r5/status:
    get:
      responses:
        "200": { description: R5 status without answer leakage }
  /api/reviewer/r5/exercises:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rcCommit, r1R4IndexHash, exerciseCatalogHash]
              additionalProperties: false
              properties:
                rcCommit: { type: string, pattern: "^[a-f0-9]{40}$" }
                r1R4IndexHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                exerciseCatalogHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "201": { description: server-created clean-clone exercise draft }
  /api/reviewer/r5/exercises/{exerciseId}/steps/{stepId}/run:
    post:
      parameters:
        - { name: exerciseId, in: path, required: true, schema: { type: string } }
        - { name: stepId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, observation]
              additionalProperties: false
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                observation: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: fixed catalog command result with output hashes }
  /api/reviewer/r5/exercises/{exerciseId}/finalize:
    post:
      parameters:
        - { name: exerciseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, reauthReviewToken]
              additionalProperties: false
      responses:
        "201": { description: immutable passed exercise artifact }
  /api/reviewer/r5/understanding-checks:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rcCommit, r1R4IndexHash, questionSetHash, answers]
              additionalProperties: false
              properties:
                rcCommit: { type: string, pattern: "^[a-f0-9]{40}$" }
                r1R4IndexHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                questionSetHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                answers: { type: array, minItems: 6, maxItems: 6 }
      responses:
        "201": { description: server-scored understanding draft }
  /api/reviewer/r5/understanding-checks/{sessionId}/finalize:
    post:
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: immutable passed understanding artifact }
  /api/reviewer/r5/handoffs:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [rcCommit, r1R4IndexHash, handoffCatalogHash, confirmGateIds, reauthReviewToken]
              additionalProperties: false
      responses:
        "201": { description: server-recomputed handoff artifact }
  /api/meta/build:
    get:
      responses:
        "200": { description: non-sensitive build provenance }
