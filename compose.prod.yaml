services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Web owns private evidence. All write-capable processes share GID 10000
    # for the SQLite directory, while retaining distinct UIDs.
    user: "10001:10000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?set a real HTTPS application URL before production deployment}
      DATABASE_URL: /var/lib/accesscheck/data/accesscheck.db
      PRIVATE_EVIDENCE_ROOT: /var/lib/accesscheck/private-evidence
      PUBLIC_EXPORT_ROOT: /var/lib/accesscheck/public-exports
      SESSION_SECRET_FILE: /run/secrets/session_secret
      ADMIN_ACCESS_KEY_FILE: /run/secrets/admin_access_key
      VISITOR_ACCESS_KEY_FILE: /run/secrets/visitor_access_key
    volumes:
      - ./private-inputs:/var/lib/accesscheck/private-evidence:rw
      - ./data:/var/lib/accesscheck/data:rw
      - ./data/exports:/var/lib/accesscheck/public-exports:rw
    secrets: [session_secret, admin_access_key, visitor_access_key]
    command: ["sh", "-c", "umask 0002 && exec node standalone/server.js"]
    expose: [3000]
    networks: [app]
  worker:
    build: .
    user: "10002:10000"
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=./tools/playwright/seccomp_profile.json
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256
    init: true
    tmpfs: [/tmp]
    environment:
      APP_ENV: production
      DATABASE_URL: /var/lib/accesscheck/data/accesscheck.db
      HTTPS_PROXY: http://egress-proxy:8080
      HTTP_PROXY: http://egress-proxy:8080
      NO_PROXY: localhost,127.0.0.1
      EGRESS_PROXY_URL: http://egress-proxy:8080
    volumes:
      - ./data:/var/lib/accesscheck/data:rw
    command: ["sh", "-c", "umask 0002 && exec pnpm worker"]
    networks: [scan-isolated]
    depends_on: [egress-proxy]
  ai-worker:
    build: .
    user: "10003:10000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    init: true
    tmpfs: [/tmp]
    environment:
      APP_ENV: production
      DATABASE_URL: /var/lib/accesscheck/data/accesscheck.db
      SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - ./data:/var/lib/accesscheck/data:rw
    secrets: [session_secret]
    command: ["sh", "-c", "umask 0002 && exec pnpm ai:worker"]
    networks: [app]
  egress-proxy:
    image: ${EGRESS_PROXY_IMAGE:?set a pinned Smokescreen/goproxy image digest before production deployment}
    read_only: true
    networks: [scan-isolated, external-egress]
    expose: [8080]
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      CADDY_SITE: ${CADDY_SITE:?set a real HTTPS domain before production deployment}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [app]
secrets:
  session_secret:
    file: ./.secrets/session_secret
  admin_access_key:
    file: ./.secrets/admin_access_key
  visitor_access_key:
    file: ./.secrets/visitor_access_key
volumes:
  caddy-data:
  caddy-config:
networks:
  app:
  scan-isolated:
    internal: true
  external-egress:
