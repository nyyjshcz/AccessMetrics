services:
  web:
    image: accesscheck-nas:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    environment:
      APP_ENV: production
      HOSTNAME: 0.0.0.0
      APP_BASE_URL: ${APP_BASE_URL:?set the Tailscale HTTPS URL}
      DATABASE_URL: /var/lib/accesscheck/data/accesscheck.db
      PRIVATE_EVIDENCE_ROOT: /var/lib/accesscheck/private-evidence
      PUBLIC_EXPORT_ROOT: /var/lib/accesscheck/public-exports
      SESSION_SECRET_FILE: /run/secrets/session_secret
      ADMIN_ACCESS_KEY_FILE: /run/secrets/admin_access_key
      VISITOR_ACCESS_KEY_FILE: /run/secrets/visitor_access_key
    volumes:
      - ./private-inputs:/var/lib/accesscheck/private-evidence:rw
      - ./data:/var/lib/accesscheck/data:rw
      - ./data/exports:/var/lib/accesscheck/public-exports:rw
    secrets:
      - source: session_secret
        target: session_secret
      - source: admin_access_key
        target: admin_access_key
      - source: visitor_access_key
        target: visitor_access_key
    command: ["sh", "-c", "umask 0002 && exec node standalone/server.js"]
    expose: [3000]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(4000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [app]

  worker:
    image: accesscheck-nas:local
    restart: unless-stopped
    user: "10002:10000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256
    init: true
    tmpfs: [/tmp]
    environment:
      APP_ENV: production
      DATABASE_URL: /var/lib/accesscheck/data/accesscheck.db
      HTTPS_PROXY: http://egress-proxy:8080
      HTTP_PROXY: http://egress-proxy:8080
      NO_PROXY: localhost,127.0.0.1
      EGRESS_PROXY_URL: http://egress-proxy:8080
      DNS_RESOLVER_MODE: proxy
    volumes:
      - ./data:/var/lib/accesscheck/data:rw
    # Invoke the bundled CLI directly. Running through pnpm would make
    # Corepack try to create a cache under /.cache in this read-only image.
    command: ["sh", "-c", "umask 0002 && exec node node_modules/tsx/dist/cli.mjs src/worker/index.ts"]
    networks: [scan-isolated]
    depends_on: [egress-proxy]

  ai-worker:
    image: accesscheck-nas:local
    restart: unless-stopped
    user: "10003:10000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    init: true
    tmpfs: [/tmp]
    environment:
      APP_ENV: production
      DATABASE_URL: /var/lib/accesscheck/data/accesscheck.db
      SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - ./data:/var/lib/accesscheck/data:rw
    secrets:
      - source: session_secret
        target: session_secret
    # Invoke the bundled CLI directly; see the worker comment above.
    command: ["sh", "-c", "umask 0002 && exec node node_modules/tsx/dist/cli.mjs src/worker/ai.ts"]
    networks: [app]

  egress-proxy:
    image: accesscheck-nas-egress:local
    restart: unless-stopped
    build:
      context: ./tools/egress-proxy
      dockerfile: Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [scan-isolated, external-egress]
    expose: [8080]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./Caddyfile.nas:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [app]

secrets:
  session_secret:
    file: ./.secrets/session_secret
  admin_access_key:
    file: ./.secrets/admin_access_key
  visitor_access_key:
    file: ./.secrets/visitor_access_key

volumes:
  caddy-data:
  caddy-config:

networks:
  app:
  scan-isolated:
    internal: true
  external-egress:
